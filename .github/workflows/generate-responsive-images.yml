name: Generate responsive image variants

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  responsive-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ImageMagick
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Generate WebP variants
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public/images

          sources=(
            "ivana-racca-atelier.webp"
            "ana-laura-turca-nicoletti-plate-dress-up.webp"
            "ana-laura-turca-nicoletti-black-dress.webp"
            "brown-dress.webp"
            "rainbow-dress.webp"
          )

          for source in "${sources[@]}"; do
            input="public/images/$source"
            base="${source%.webp}"

            for width in 320 480 768; do
              output="public/images/${base}-${width}.webp"
              magick "$input" \
                -auto-orient \
                -resize "${width}x>" \
                -strip \
                -quality 78 \
                -define webp:method=6 \
                "$output"
            done
          done

      - name: Commit generated variants
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/images/*-320.webp public/images/*-480.webp public/images/*-768.webp

          if git diff --cached --quiet; then
            echo "No image variants changed."
            exit 0
          fi

          git commit -m "perf(images): generate responsive WebP variants"
          git push
